docRoot                   /usr/local/lsws/conf/vhosts/elysium.warga-digital.com/docroot
vhDomain                  elysium.warga-digital.com
enableGzip                1
extprocessor elysium_proxy {
  type                    proxy
  address                 127.0.0.1:18086
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}
context / {
  type                    proxy
  handler                 elysium_proxy
  addDefaultCharset       off
}
context /.well-known/acme-challenge {
  location                /usr/local/lsws/conf/vhosts/elysium.warga-digital.com/docroot
  allowBrowse             1
  rewrite  {
    enable                0
  }
}
